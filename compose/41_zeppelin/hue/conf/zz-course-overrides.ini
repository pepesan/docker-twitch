# Conector a la base de datos simulada de auditoría del laboratorio (servicio
# `db` en compose.yaml). Sin este fichero, la imagen gethue/hue arranca sin
# ningún intérprete SQL activo (todos vienen comentados en su config por
# defecto) y no se podría lanzar ninguna consulta desde la interfaz web.
#
# Nombrado con prefijo "zz-" para que se cargue después de
# z-hue-overrides.ini (los ficheros .ini del directorio de configuración se
# fusionan en orden alfabético) y sus valores no se pisen entre sí.

[desktop]

# Metastore propio de HUE (usuarios, historial, documentos guardados) en
# Postgres en vez de SQLite (el motor por defecto de la imagen). Con SQLite,
# las peticiones concurrentes que ya genera la propia UI de HUE (polling de
# estado, autocompletado, historial) acaban provocando errores intermitentes
# de "database is locked" — SQLite no soporta bien escrituras concurrentes.
# BBDD "hue" creada aparte en el mismo servidor Postgres del laboratorio
# (ver README: CREATE DATABASE hue OWNER auditor;), separada de "auditoria"
# para no mezclar el metastore de HUE con los datos del curso.
[[database]]
engine=postgresql_psycopg2
host=db
port=5432
user=auditor
password=auditor
name=hue

[notebook]

[[interpreters]]

[[[postgresql]]]
name=Auditoría (Postgres)
interface=sqlalchemy
options='{"url": "postgresql://auditor:auditor@db:5432/auditoria"}'
