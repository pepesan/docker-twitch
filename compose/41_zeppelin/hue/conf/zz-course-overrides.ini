# Conector a la base de datos simulada de auditoría del laboratorio (servicio
# `db` en compose.yaml). Sin este fichero, la imagen gethue/hue arranca sin
# ningún intérprete SQL activo (todos vienen comentados en su config por
# defecto) y no se podría lanzar ninguna consulta desde la interfaz web.
#
# Nombrado con prefijo "zz-" para que se cargue después de
# z-hue-overrides.ini (los ficheros .ini del directorio de configuración se
# fusionan en orden alfabético) y sus valores no se pisen entre sí.

[notebook]

[[interpreters]]

[[[postgresql]]]
name=Auditoría (Postgres)
interface=sqlalchemy
options='{"url": "postgresql://auditor:auditor@db:5432/auditoria"}'
