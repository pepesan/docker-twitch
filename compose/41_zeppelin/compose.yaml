# Servicios Docker para los laboratorios del curso Python + Auditoría (BBK).
#
# Autor: David Vaquero Santiago (pepesan@gmail.com)
#
# Uso:
#   cd docker
#   docker compose up -d
#   docker compose down          # parar
#   docker compose down -v       # parar y borrar datos persistidos

services:

  # Módulos 1, 3 y 4 — entorno de notebooks
  zeppelin:
    build: ./zeppelin/image
    image: pepesan/zeppelin:python-3.14
    container_name: curso_zeppelin
    ports:
      - "8080:8080"
    environment:
      ZEPPELIN_ADDR: "0.0.0.0"
    volumes:
      - ./volumes/zeppelin/notebook:/opt/zeppelin/notebook
      - ./volumes/zeppelin/logs:/opt/zeppelin/logs
      - ./zeppelin/ejemplos:/opt/zeppelin/notebook/ejemplos

  # Módulos 3 y 4 — base de datos corporativa simulada (sustituye a la BBDD real del banco)
  db:
    image: postgres:18.6
    container_name: curso_db
    environment:
      POSTGRES_DB: auditoria
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/db:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Módulo 3 — simulación de HUE para consultas SQL vía interfaz web
  hue:
    image: gethue/hue:20260611-140101
    container_name: curso_hue
    ports:
      - "8888:8888"
    depends_on:
      - db

  # Módulo 3 — cliente web ligero para inspeccionar la base de datos simulada
  # Puerto 8091 (no 8081): dentro de un escritorio Kasm Workspaces, 8081 ya
  # lo usa el servicio de audio del propio escritorio (kasm_audio_out).
  adminer:
    image: adminer:6.0.1
    container_name: curso_adminer
    ports:
      - "8091:8080"
    depends_on:
      - db
