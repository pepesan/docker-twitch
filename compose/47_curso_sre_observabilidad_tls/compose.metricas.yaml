## Módulo 1 — MÉTRICAS: node-exporter, blackbox-exporter, Prometheus, Alertmanager.
##
## Se puede levantar solo: docker compose --env-file compose.env -f compose.metricas.yaml up -d
## Sin `depends_on` hacia servicios de otros módulos (el orden lo dan los
## scripts 01..06); `restart: always` cubre el arranque en desorden.

services:

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    restart: always
    pid: host
    command:
      - '--path.rootfs=/host'
      # Colectores opcionales que usa el dashboard "Node Exporter Full"
      - '--collector.processes'
      - '--collector.tcpstat'
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: always
    volumes:
      - ./config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  cadvisor:
    ## Métricas por contenedor (CPU, RAM, red, IO, reinicios) de este host.
    ## Sin `ports:`: solo lo consulta Prometheus por la red interna.
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./config/targets:/etc/prometheus/targets:ro   # file_sd (métricas del demonio Docker)
      - ./volumes/prometheus/data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'   # llegar al demonio Docker del host (métricas)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
      - blackbox-exporter

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: always
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./volumes/alertmanager/data:/alertmanager
    ports:
      - "9093:9093"

