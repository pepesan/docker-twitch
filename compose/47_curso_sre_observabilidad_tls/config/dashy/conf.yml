---
pageInfo:
  title: "SRE Lab — Observabilidad Segura (TLS/Auth)"
  description: "Portal del laboratorio SRE (Compose 47). Acceso directo por localhost o por HTTPS (*.lab.local) tras ejecutar ./host/hosts.sh."
  navLinks:
    - title: "Documentación Dashy"
      path: "https://dashy.to/docs"

appConfig:
  theme: modern
  layout: auto
  iconSize: medium
  statusCheckInterval: 10

sections:
  - name: Visualización y Métricas
    icon: fas fa-chart-line
    items:
      - title: Grafana
        description: "Paneles y dashboards de métricas, logs y trazas (HTTPS: https://grafana.lab.local)"
        icon: si-grafana
        url: http://localhost:3030
        target: newtab
        statusCheck: true
        statusCheckUrl: http://grafana:3000/api/health

      - title: Prometheus
        description: "Servidor central de métricas y consultas PromQL (HTTPS: https://prometheus.lab.local)"
        icon: si-prometheus
        url: http://localhost:9090
        target: newtab
        statusCheck: true
        statusCheckUrl: http://prometheus:9090/-/ready

      - title: Alertmanager
        description: "Enrutamiento y gestión de alertas (HTTPS: https://alertmanager.lab.local)"
        icon: fas fa-bell
        url: http://localhost:9093
        target: newtab
        statusCheck: true
        statusCheckUrl: http://alertmanager:9093/-/ready

      - title: Blackbox Exporter
        description: "Monitoreo de disponibilidad HTTP de endpoints"
        icon: fas fa-network-wired
        url: http://localhost:9115
        target: newtab
        statusCheck: true
        statusCheckUrl: http://blackbox-exporter:9115/

      - title: Node Exporter
        description: "Métricas del host y del sistema base"
        icon: fas fa-server
        url: http://localhost:9100/metrics
        target: newtab
        statusCheck: true
        statusCheckUrl: http://node-exporter:9100/metrics

  - name: Logs y Agentes
    icon: fas fa-file-alt
    items:
      - title: Loki API
        description: "Ingesta y consulta LogQL (HTTPS: https://loki.lab.local)"
        icon: fas fa-file-alt
        url: http://localhost:3100/ready
        target: newtab
        statusCheck: true
        statusCheckUrl: http://loki:3100/ready

      - title: Grafana Alloy UI
        description: "Recolector unificado OpenTelemetry y visualizador de pipeline (HTTPS: https://alloy.lab.local)"
        icon: fas fa-cubes
        url: http://localhost:12345
        target: newtab
        statusCheck: true
        statusCheckUrl: http://alloy:12345/-/ready

  - name: Trazas y Telemetría
    icon: fas fa-project-diagram
    items:
      - title: Tempo API
        description: "Almacén distribuido de trazas de alta escala (HTTPS: https://tempo.lab.local)"
        icon: fas fa-route
        url: http://localhost:3200/ready
        target: newtab
        statusCheck: true
        statusCheckUrl: http://tempo:3200/ready

      - title: OpenTelemetry Collector
        description: "Pipeline OTLP con métricas expuestas para Prometheus"
