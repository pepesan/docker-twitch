        icon: fas fa-car
        url: http://localhost:8082
        target: newtab
        statusCheck: true
        statusCheckUrl: http://hotrod:8080/
      - title: Demo App Spring Boot
        description: "App Spring Boot con métricas, logs y trazas; /api/traza devuelve el enlace a su traza (HTTPS: https://demo-app.lab.local)"
        icon: fas fa-leaf
        url: http://localhost:8090/api/traza
        target: newtab
        statusCheck: true
        statusCheckUrl: http://demo-app:8080/actuator/health
