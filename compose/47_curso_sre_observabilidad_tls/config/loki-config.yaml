# Loki en modo monolítico (single-binary), sin autenticación, pensado para
# un único nodo de laboratorio: no replica entre nodos ni usa un backend
# remoto de objetos.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    # Anillo en memoria: válido solo con una instancia de Loki; un clúster
    # real necesitaría un kvstore compartido (etcd, consul...).
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    # TSDB es el motor de índice recomendado actualmente por el proyecto Loki.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  # Almacenamiento local en disco; en producción suele sustituirse por un
  # object store (S3, GCS, Azure Blob...).
  filesystem:
    directory: /loki/chunks

limits_config:
  # Necesario para que Grafana pueda correlacionar logs con trace_id (ver
  # derivedFields en datasources.yaml).
  allow_structured_metadata: true
  # El límite por defecto (4 MB/s, pensado para proteger a un tenant de
  # otro en un Loki multi-tenant real) se queda corto en este laboratorio:
  # Alloy y Promtail tailan los mismos contenedores a la vez (uno por el
  # socket Docker, el otro por journal/ficheros), compitiendo por el mismo
  # cupo del único tenant ("fake") que existe aquí. Subido para este
  # entorno de un solo tenant local, no recomendable tal cual en Loki
  # multi-tenant de producción.
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  # Límite aparte del anterior: por stream individual (no por tenant). El
  # job "docker" de Promtail/Alloy puede generar streams muy activos al
  # releer el historial completo de un contenedor.
  per_stream_rate_limit: 32MB
  per_stream_rate_limit_burst: 64MB

compactor:
  working_directory: /loki/compactor
