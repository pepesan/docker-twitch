server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs de los contenedores Docker de ESTE proyecto (vía discovery de
  # ficheros de log en /var/lib/docker/containers), etiquetados con el
  # nombre del contenedor. Es el equivalente "on-premise" de lo que en
  # Grafana Cloud haría un agente gestionado; docker_sd_configs es el
  # equivalente de discovery.docker + loki.source.docker de Alloy.
  # Filtrado al proyecto (igual que discovery.relabel.contenedores_lab en
  # Alloy): el host puede tener otros proyectos Docker corriendo, y sin este
  # filtro Promtail leería también sus logs.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '47_curso_sre_observabilidad_tls'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      # `job` como en la convención de Loki (proyecto/servicio), que usan los
      # dashboards comunitarios; para contenedores fuera de compose, su nombre.
      - source_labels: ['container']
        target_label: 'job'
      - source_labels: ['compose_project', 'compose_service']
        separator: '/'
        regex: '(.+)/(.+)'
        target_label: 'job'
        replacement: '$1/$2'
      - replacement: 'promtail'
        target_label: 'agent'

  # Logs del propio sistema Linux del host (systemd/journal vía ficheros en
  # /var/log), para el bloque de "Logging centralizado" — problemática de
  # logging distribuido en múltiples máquinas del CPD.
  - job_name: syslog
    static_configs:
      - targets: ['localhost']
        labels:
          job: syslog
          __path__: /var/log/host/syslog
