# Configuración de Alertmanager para el curso. Las alertas críticas van al
# receiver "email-sre", contra el SMTP de pruebas del propio laboratorio
# (servicio "mailserver", sin TLS ni autenticación: smarthost sin
# require_tls ni auth_username/auth_password). El resto sigue en "default"
# (sin notificar). Para un SMTP real externo, descomenta el bloque TLS/auth
# de más abajo y cambia el smarthost.
global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: 'email-sre'

receivers:
  - name: 'default'
    # webhook_configs:
    #   - url: 'http://host.docker.internal:5001/alertas'
    #     send_resolved: true
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/T00/B00/XXXX'
    #     channel: '#alertas-sre'
    #     send_resolved: true

  - name: 'email-sre'
    email_configs:
      - to: 'alertas-alertmanager@lab.local'
        from: 'alertmanager@lab.local'
        smarthost: 'mailserver:3025'
        require_tls: false
        send_resolved: true
        # Para un SMTP real externo (STARTTLS, puerto 587 habitual):
        # auth_username: 'alertmanager@tuempresa.com'
        # auth_password: 'CAMBIA_ESTA_PASSWORD'
        # require_tls: true
        # tls_config:
        #   insecure_skip_verify: false
        #   # ca_file: '/etc/alertmanager/certs/ca.pem'  # si el SMTP usa CA propia

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']
