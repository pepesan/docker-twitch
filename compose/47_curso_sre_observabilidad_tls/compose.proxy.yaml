## Módulo 6 — PROXY TLS: Caddy (reverse proxy con CA local autofirmada).
##
## Se puede levantar solo: docker compose --env-file compose.env -f compose.proxy.yaml up -d
## Sin `depends_on` hacia servicios de otros módulos (el orden lo dan los
## scripts 01..06); `restart: always` cubre el arranque en desorden.

services:

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: always
    env_file: ./caddy.env   # CADDY_BASIC_USER / CADDY_BASIC_HASH (los genera 00_init.sh)
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pki:/pki:ro                   # CA raíz propia del laboratorio (la crea 00_init.sh)
      - ./volumes/caddy/data:/data       # aquí queda la CA local (pki/authorities/local/root.crt)
      - ./volumes/caddy/config:/config
    environment:
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}   # para las URLs de redirect del Caddyfile
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "16686:16686"   # redirige los enlaces de traza de hot-rod a Grafana/Tempo
