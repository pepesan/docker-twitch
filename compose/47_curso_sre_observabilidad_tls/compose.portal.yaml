## Módulo 7 — PORTAL: Dashy (portal unificado de acceso a servicios).
##
## Se puede levantar solo: docker compose --env-file compose.env -f compose.portal.yaml up -d
## Sin `depends_on` hacia servicios de otros módulos (el orden lo dan los
## scripts 01..07); `restart: always` cubre el arranque en desorden.

services:

  dashy:
    image: lissy93/dashy:latest
    container_name: sre-dashy-tls
    restart: always
    volumes:
      - ./config/dashy/conf.yml:/app/user-data/conf.yml:ro
    ports:
      - "4000:8080"
    environment:
      - NODE_ENV=production
