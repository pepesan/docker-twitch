## Módulo 4 — VISUALIZACIÓN: Grafana (datasources Prometheus/Loki/Tempo preconfigurados).
##
## Se puede levantar solo: docker compose --env-file compose.env -f compose.grafana.yaml up -d
## Sin `depends_on` hacia servicios de otros módulos (el orden lo dan los
## scripts 01..06); `restart: always` cubre el arranque en desorden.

services:

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: always
    env_file: ./compose.env
    volumes:
      - ./volumes/grafana/data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3030:3000"

