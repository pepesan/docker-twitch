services:
  awx:
    image: "${AWX_IMAGE:-ghcr.io/ansible/awx_devel:devel}"
    container_name: awx
    hostname: awx-1
    user: "1000"
    privileged: true
    tty: true
    command: launch_awx.sh supervisord --pidfile=/tmp/supervisor_pid -n
    working_dir: /awx_devel
    environment:
      MAIN_NODE_TYPE: hybrid
      CONTROL_PLANE_NODE_COUNT: 1
      EXECUTION_NODE_COUNT: 0
      AWX_LOGGING_MODE: stdout
      AWX_GROUP_QUEUES: tower
      RECEPTORCTL_SOCKET: /var/run/awx-receptor/receptor.sock
      RUN_MIGRATIONS: 1
    volumes:
      - ./awx:/awx_devel
      - ./awx/tools/docker-compose/supervisor.conf:/etc/supervisord.conf
      - ./awx/tools/docker-compose/_sources/database.py:/etc/tower/conf.d/database.py
      - ./awx/tools/docker-compose/_sources/websocket_secret.py:/etc/tower/conf.d/websocket_secret.py
      - ./awx/tools/docker-compose/_sources/local_settings.py:/etc/tower/conf.d/local_settings.py
      - ./awx/tools/docker-compose/_sources/nginx.conf:/etc/nginx/nginx.conf
      - ./awx/tools/docker-compose/_sources/nginx.locations.conf:/etc/nginx/conf.d/nginx.locations.conf
      - ./awx/tools/docker-compose/_sources/SECRET_KEY:/etc/tower/SECRET_KEY
      - ./awx/tools/docker-compose/_sources/receptor/receptor-awx-1.conf:/etc/receptor/receptor.conf
      - ./awx/tools/docker-compose/_sources/receptor/receptor-awx-1.conf.lock:/etc/receptor/receptor.conf.lock
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ./volumes/redis_socket:/var/run/redis/:rw
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "${AWX_HTTP_PORT:-8013}:8013"   # http
      - "${AWX_HTTPS_PORT:-8043}:8043"  # https

  redis:
    image: mirror.gcr.io/library/redis:7.4.8
    container_name: awx_redis
    entrypoint: ["redis-server"]
    command: ["/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./awx/tools/redis/redis.conf:/usr/local/etc/redis/redis.conf:Z
      - ./volumes/redis_socket:/var/run/redis/:rw

  postgres:
    image: postgres:17
    container_name: awx_postgres
    command: >
      postgres -c log_destination=stderr -c log_min_messages=info -c log_min_duration_statement=1000 -c max_connections=1024
    environment:
      POSTGRES_USER: awx
      POSTGRES_DB: awx
      POSTGRES_PASSWORD: "${AWX_PG_PASSWORD:-awxpass123456}"
    volumes:
      - ./volumes/awx_db:/var/lib/postgresql/data
    ports:
      - "${AWX_PG_PORT:-5441}:5432"
