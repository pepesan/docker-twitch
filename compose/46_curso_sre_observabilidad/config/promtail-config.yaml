server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Logs de TODOS los contenedores Docker del host (vía discovery del
  # socket Docker), para demostrar que Promtail también sabe leer logs de
  # contenedores, no solo journald: docker_sd_configs es el equivalente de
  # discovery.docker + loki.source.docker de Alloy (ver config.alloy). Sin
  # filtrar por proyecto a propósito: el host puede tener otros contenedores
  # con logs muy antiguos, y Loki los acepta igual
  # gracias a reject_old_samples_max_age en loki-config.yaml.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project', '__meta_docker_container_label_com_docker_compose_service']
        separator: '/'
        regex: '(.+)/(.+)'
        target_label: 'job'
        replacement: '$1/$2'
      - replacement: 'promtail'
        target_label: 'agent'
