receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métricas reales del propio contenedor del collector (CPU, memoria, disco,
  # red), para que el pipeline "metrics" tenga tráfico de verdad sin depender
  # de que una app envíe métricas por OTLP.
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      network: {}
      load: {}

processors:
  batch: {}

exporters:
  # Trazas -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Métricas -> expuestas en :8889 para que Prometheus las scrapee (job
  # "otel-collector" en config/prometheus.yml)
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs -> Loki, vía su endpoint nativo OTLP (Loki 3.x). Alloy (config.alloy)
  # ya no escribe directamente a Loki: convierte a OTLP y los manda aquí, así
  # este pipeline lleva tráfico real.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
