server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  # Procesador local-blocks: necesario para las métricas TraceQL
  # (Grafana Traces Drilldown, `| rate() by(...)`). Guarda los bloques
  # recientes en local para poder consultarlos.
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
    span_metrics:
      # Etiqueta `service_name` (además de `service`) que esperan los
      # dashboards comunitarios de span metrics.
      dimensions: ['service.name']
  traces_storage:
    path: /var/tempo/generator/traces
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
