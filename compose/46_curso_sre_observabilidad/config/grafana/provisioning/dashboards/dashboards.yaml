# Provisiona por fichero los dashboards que haya en el volumen montado en
# options.path, en vez de crearlos a mano en la interfaz de Grafana.
apiVersion: 1

providers:
  - name: 'curso-sre'
    orgId: 1
    folder: 'Curso SRE'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
