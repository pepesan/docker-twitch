---
pageInfo:
  title: SRE Lab — Observabilidad
  description: Portal de acceso rápido a los servicios del laboratorio SRE (Docker Compose 46)
  navLinks:
    - title: Documentación Dashy
      path: https://dashy.to/docs

appConfig:
  theme: modern
  layout: auto
  iconSize: medium
  statusCheckInterval: 10

sections:
  - name: Visualización y Métricas
    icon: fas fa-chart-line
    items:
      - title: Grafana
        description: Paneles y dashboards de métricas, logs y trazas
        icon: si-grafana
        url: http://localhost:3030
        target: newtab
        statusCheck: true
        statusCheckUrl: http://grafana:3000/api/health

      - title: Prometheus
        description: Servidor central de métricas y consultas PromQL
        icon: si-prometheus
        url: http://localhost:9090
        target: newtab
        statusCheck: true
        statusCheckUrl: http://prometheus:9090/-/ready

      - title: Alertmanager
        description: Gestión y enrutamiento de alertas de Prometheus
        icon: fas fa-bell
        url: http://localhost:9093
        target: newtab
        statusCheck: true
        statusCheckUrl: http://alertmanager:9093/-/ready

      - title: Blackbox Exporter
        description: Pruebas de disponibilidad HTTP y endpoints de red
        icon: fas fa-network-wired
        url: http://localhost:9115
        target: newtab
        statusCheck: true
        statusCheckUrl: http://blackbox-exporter:9115/

      - title: Node Exporter
        description: Métricas del host y del sistema base
        icon: fas fa-server
        url: http://localhost:9100/metrics
        target: newtab
        statusCheck: true
        statusCheckUrl: http://node-exporter:9100/metrics

  - name: Logs y Agentes
    icon: fas fa-file-alt
    items:
      - title: Loki API
        description: Almacén central de logs y consultas LogQL
        icon: fas fa-file-alt
        url: http://localhost:3100/ready
        target: newtab
        statusCheck: true
        statusCheckUrl: http://loki:3100/ready

      - title: Grafana Alloy UI
        description: Recolector unificado de telemetría y grafo de componentes
        icon: fas fa-cubes
        url: http://localhost:12345
        target: newtab
        statusCheck: true
        statusCheckUrl: http://alloy:12345/-/ready

  - name: Trazas y Telemetría
    icon: fas fa-project-diagram
    items:
      - title: Tempo API
        description: Almacén distribuido de trazas de alta escala
        icon: fas fa-route
        url: http://localhost:3200/ready
        target: newtab
        statusCheck: true
        statusCheckUrl: http://tempo:3200/ready

      - title: OpenTelemetry Collector
        description: Pipeline de métricas expuestas para Prometheus
        icon: si-opentelemetry
        url: http://localhost:8889/metrics
        target: newtab
        statusCheck: true
        statusCheckUrl: http://otel-collector:8889/metrics

  - name: Aplicación de Demostración
    icon: fas fa-flask
    items:
      - title: Jaeger Hot-Rod
        description: Aplicación de ejemplo instrumentada con OpenTelemetry
        icon: fas fa-car
        url: http://localhost:8082
        target: newtab
        statusCheck: true
        statusCheckUrl: http://hotrod:8080/
