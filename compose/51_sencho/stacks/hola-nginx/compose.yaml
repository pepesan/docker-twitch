# Stack de ejemplo para desplegar desde Sencho: un nginx sirviendo una página
# estática. Sencho lo detecta al estar en COMPOSE_DIR (./stacks/hola-nginx).
services:
  web:
    image: nginx:1.31.6-alpine
    container_name: hola-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
