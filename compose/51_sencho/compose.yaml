# Sencho (sencho.io): panel web para gestionar stacks de Docker Compose.
# Imagen: saelix/sencho (versión fijada a la última publicada: 0.97.1).
#
# Este compose queda FUERA de COMPOSE_DIR (./stacks): Sencho no debe
# gestionarse a sí mismo como stack (se actualiza con Fleet -> Node Update).
#
# Regla "1:1 path": la ruta de los stacks en el host debe ser IDÉNTICA a la
# del contenedor. Por eso se usa ${PWD}/stacks en ambos lados: lanzar siempre
# desde este directorio (los scripts 0X_*.sh ya hacen cd).

services:
  sencho:
    image: saelix/sencho:0.97.1
    container_name: sencho
    restart: always
    ports:
      - "1852:1852"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${PWD}/stacks:${PWD}/stacks
    environment:
      - COMPOSE_DIR=${PWD}/stacks
      - DATA_DIR=/app/data
